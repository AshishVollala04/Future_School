spring.datasource.url=jdbc:h2:mem:fs_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# The V2 migration is PostgreSQL-specific; tests build the schema from the entities.
spring.flyway.enabled=false
app.seed.demo-data=true
app.otp.dev-reveal=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Tests share one database, so the same demo mobiles are used many times.
app.otp.rate-max=50
app.alerts.dispatch-enabled=false
app.alerts.absence-hold-minutes=0
