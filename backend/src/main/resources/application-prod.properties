# Production profile: start with  --spring.profiles.active=prod
# ProductionSafetyCheck refuses to start if any of these are unsafe. Secrets come from
# environment variables, never from this file.

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# Flyway owns the schema (V1..V4 = complete schema). Hibernate only checks that it matches;
# it never changes tables in production. Every schema change is a new migration file.
spring.jpa.hibernate.ddl-auto=validate

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=43200000
app.cors.allowed-origins=${APP_ORIGIN}

# Never seed demo people; never show OTP codes in responses
app.seed.demo-data=false
app.otp.dev-reveal=false

# SMS: any DLT-registered gateway. The body must match your DLT-approved template.
# Placeholders: {{mobile}} (10 digits), {{code}}, {{minutes}}. Example shape for MSG91 Flow:
#   SMS_GATEWAY_URL=https://control.msg91.com/api/v5/flow
#   SMS_GATEWAY_HEADER=authkey
#   SMS_GATEWAY_BODY={"template_id":"<your DLT template id>","recipients":[{"mobiles":"91{{mobile}}","otp":"{{code}}"}]}
app.otp.sms.provider=http
app.otp.sms.http.url=${SMS_GATEWAY_URL}
app.otp.sms.http.header-name=${SMS_GATEWAY_HEADER:authkey}
app.otp.sms.http.header-value=${SMS_GATEWAY_KEY}
app.otp.sms.http.body=${SMS_GATEWAY_BODY}

# Email (Principal/Admin second factor, step-up for staff): any SMTP provider
app.otp.email.provider=smtp
app.otp.email.from=${MAIL_FROM}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Microsoft / Google sign-in for Principal and Admin (optional; off while a client id is empty).
# The redirect URI must be registered with the provider exactly as written here.
app.idp.redirect-uri=${IDP_REDIRECT_URI:}
app.idp.microsoft.client-id=${MS_CLIENT_ID:}
app.idp.microsoft.client-secret=${MS_CLIENT_SECRET:}
app.idp.microsoft.tenant=${MS_TENANT:organizations}
app.idp.google.client-id=${GOOGLE_CLIENT_ID:}
app.idp.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# WhatsApp alerts to parents (Meta WhatsApp Cloud API). Leave WHATSAPP_PROVIDER unset (log) until
# the school's WhatsApp Business number and both message templates are approved by Meta.
# Templates (body variables in this order):
#   student_absent : {{1}} student name, {{2}} date, {{3}} school name
#   fee_reminder   : {{1}} student name, {{2}} overdue amount, {{3}} school name
app.alerts.provider=${WHATSAPP_PROVIDER:log}
app.alerts.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.alerts.whatsapp.token=${WHATSAPP_TOKEN:}
app.alerts.whatsapp.language=${WHATSAPP_LANGUAGE:en}
app.alerts.whatsapp.template.absent=${WHATSAPP_TEMPLATE_ABSENT:student_absent}
app.alerts.whatsapp.template.fee-due=${WHATSAPP_TEMPLATE_FEE:fee_reminder}
app.alerts.absence-hold-minutes=${ABSENCE_HOLD_MINUTES:10}


# Fee payments (Razorpay + UPI). Leave PAYMENTS_PROVIDER unset (mock) until Razorpay KYC is live.
# Never store card numbers, CVV, UPI PIN, VPA, or bank passwords.
app.payments.provider=${PAYMENTS_PROVIDER:mock}
app.payments.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payments.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payments.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
