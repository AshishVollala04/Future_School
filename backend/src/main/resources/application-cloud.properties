# Cloud profile for online staging / testing deployment (Render, Koyeb, Railway, etc.)
server.port=${PORT:5000}

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futureschool}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway migrations
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security & CORS
jwt.secret=${JWT_SECRET:FutureschoolSecretKeyForJwtTokenGenerationSecurityMustBe256BitsLongAtLeast123456}
jwt.expiration-ms=43200000
app.cors.allowed-origins=${APP_ORIGIN:*}

# Seed & OTP reveal enabled so the live deployment is fully testable immediately
app.seed.demo-data=true
app.otp.dev-reveal=true
app.otp.sms.provider=log
app.otp.email.provider=log
