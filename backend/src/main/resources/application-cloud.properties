# Cloud profile for online staging / testing deployment (Render, Cloud Run, Railway, etc.)
server.port=${PORT:5000}

# Database connection (supports internal host/port/name vars, optional DB_QUERY like ?sslmode=require, or full DB_URL)
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:futureschool}${DB_QUERY:}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep Hikari pool tuned for 512 MB containers while avoiding single-request queueing and re-enabling pgJDBC batching
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=180000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.prepareThreshold=3

# Hibernate batching & fast startup (skip redundant JDBC metadata probes)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations manage schema cleanly
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Security, Auth Session Cache & CORS
jwt.secret=${JWT_SECRET:FutureschoolSecretKeyForJwtTokenGenerationSecurityMustBe256BitsLongAtLeast123456}
jwt.expiration-ms=43200000
app.auth.session-cache-ms=20000
app.cors.allowed-origins=${APP_ORIGIN:*}

# Real Future School dataset + single DB-backed staging OTP (disabled automatically in prod)
app.seed.demo-data=false
app.seed.future-school=true
app.otp.dev-reveal=true
app.otp.fixed-code=123456
app.otp.rate-max=100
app.otp.sms.provider=log
app.otp.email.provider=log
