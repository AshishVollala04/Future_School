# FutureSchool High School Management System Configuration
server.port=5000

# PostgreSQL 17 Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/futureschool
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=FutureschoolSecretKeyForJwtTokenGenerationSecurityMustBe256BitsLongAtLeast123456
jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4173,http://127.0.0.1:3000,http://127.0.0.1:3001

# Multi-school: never keep a DB session open across the request (tenant is per transaction)
spring.jpa.open-in-view=false

# Flyway runs BEFORE Hibernate. V2 adds school_id to existing tables and labels old rows GVS.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Demo seed (two schools). Set to false in production.
app.seed.demo-data=true

# OTP delivery is not configured: in development the code is returned in the API response
# (frontend shows it as "Prototype"). MUST be false in production.
app.otp.dev-reveal=true

# Store all timestamps in UTC (OTP/ticket/session expiry depend on it)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# WhatsApp alerts to parents. provider=log records alerts without delivering them (development).
app.alerts.provider=log
app.alerts.absence-hold-minutes=10

# Online fee payments (mock | razorpay). Never store card numbers, CVV, UPI PIN, or VPA.
app.payments.provider=mock
