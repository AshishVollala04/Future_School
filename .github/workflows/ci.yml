# FutureSchool CI: runs on every push and pull request.
#   backend           82 Spring Boot tests (H2): sign-in, multi-school isolation, every workflow
#   backend-postgres  Flyway V2..V9 on an empty PostgreSQL 17, then the app must start with
#                     ddl-auto=validate and the demo seed (proves migrations match the entities)
#   frontend          typecheck, production build, 325 service rule checks (mock mode)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: ./mvnw -B -ntp clean test
      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  backend-postgres:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: futureschool_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Migrate an empty database, then start with schema validation
        run: |
          ./mvnw -B -ntp spring-boot:run \
            -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:postgresql://localhost:5432/futureschool_ci --spring.datasource.username=postgres --spring.datasource.password=postgres --spring.jpa.hibernate.ddl-auto=validate --spring.main.web-application-type=none --app.seed.demo-data=true" \
            | tee run.log
          grep -q "now at version v9" run.log
          grep -q "Demo seed ready" run.log

  frontend:
    name: Frontend typecheck, build, rule checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:services
