services:
  - type: web
    name: futureschool-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/auth/idp/providers
    envVars:
      - key: PORT
        value: 5000
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DB_HOST
        fromDatabase:
          name: futureschool-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: futureschool-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: futureschool-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: futureschool-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: futureschool-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: "*"

databases:
  - name: futureschool-db
    databaseName: futureschool
    user: futureschool_user
    plan: free
    region: oregon
